[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplicity-chain"
version = "0.1.0"
description = "A tiny smolagents-style library: agents that act by writing Python code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["agents", "llm", "code-agent", "smolagents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
simplicity-chain = "simplicity_chain.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simplicity_chain"]

[tool.hatch.build]
exclude = [
    "/.uv-cache",
    "/.venv",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.coverage",
    "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["simplicity_chain"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
